# =================================================================
# BillFlow Production Docker Compose Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =================================================================
services:
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on: !reset []
    restart: always

  web:
    ports:
      - "${APP_PORT:-80}:80"
    restart: always

  queue:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on: !reset
      app:
        condition: service_started
    restart: always

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on: !reset
      app:
        condition: service_started
    restart: always

  # In production, do not expose internal database or redis ports to the host network
  db:
    ports: !reset []
    restart: always

  redis:
    ports: !reset []
    restart: always
