services:
  # ==========================================
  # Laravel PHP-FPM Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: billflow-app:latest
    container_name: billflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Nginx Web Server (Frontend & Reverse Proxy)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: billflow-web:latest
    container_name: billflow_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage:ro
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Laravel Queue Worker (Managed by Supervisor)
  # ==========================================
  queue:
    image: billflow-app:latest
    container_name: billflow_queue
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status queue-worker:* | grep -q RUNNING || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Laravel Task Scheduler
  # ==========================================
  scheduler:
    image: billflow-app:latest
    container_name: billflow_scheduler
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - billflow-network

  # ==========================================
  # MySQL Database (Local Development)
  # ==========================================
  db:
    image: mysql:8.4
    container_name: billflow_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-billflow}
      MYSQL_USER: ${DB_USERNAME:-billflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-billflow_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================
  # Redis (Cache, Sessions, Optional Queue)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: billflow_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - billflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  billflow-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

